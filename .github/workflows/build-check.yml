# Type-checks and builds the app on every push, so a broken change is caught
# before it reaches the branch Lovable syncs.
name: Build check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Type check
        run: |
          set +e
          bunx tsc --noEmit -p tsconfig.json 2>&1 | tee tsc.log
          status=${PIPESTATUS[0]}
          grep -E "error TS" tsc.log | head -n 10 | while IFS= read -r line; do echo "::error::${line}"; done
          exit "$status"
      - name: Build
        run: |
          set +e
          bun run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 10 build.log | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit "$status"
