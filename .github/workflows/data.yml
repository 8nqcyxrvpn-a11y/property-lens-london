# Builds the Property Lens data from public sources and commits it.
# Manual: choose which steps to run. Monthly: the full rebuild picks up new sales.
name: Build data

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run, e.g. 1,3,2,5,4 (1 sales, 2 areas, 3 nearby, 5 EPC sizes, 6 rents, 4 model and export)"
        required: true
        default: "1,3,2,5,6,4"
      epc_minutes:
        description: "Minutes the EPC step may run before saving and stopping"
        required: false
        default: "150"
  schedule:
    - cron: "41 4 2 * *" # 2nd of each month, 04:41 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: python -m pip install -r pipeline/requirements.txt

      - name: Run
        working-directory: pipeline
        env:
          STEPS: ${{ inputs.steps || '1,3,2,5,6,4' }}
          EPC_API_TOKEN: ${{ secrets.EPC_API_TOKEN }}
          EPC_TIME_LIMIT_MIN: ${{ inputs.epc_minutes || '150' }}
        run: |
          set +e
          status=0
          for s in $(echo "$STEPS" | tr ',' ' '); do
            case "$s" in
              1) script=step1_sales.py ;;
              2) script=step2_areas.py ;;
              3) script=step3_nearby.py ;;
              4) script=step4_model.py ;;
              5) script=step5_epc.py ;;
              6) script=step6_rents.py ;;
              x) script=experiment_models.py ;;
              *) echo "::error::unknown step $s"; exit 1 ;;
            esac
            echo "== step $s: $script"
            python "$script" 2>&1 | tee "log_$s.txt"
            code=${PIPESTATUS[0]}
            tail -n 45 "log_$s.txt" | cut -c1-250 > tail.txt
            split -l 15 tail.txt part_
            for part in part_*; do
              echo "::notice title=Step $s::$(sed 's/%/%25/g' "$part" | paste -sd '|' -)"
            done
            rm -f part_* tail.txt
            if [ "$code" -ne 0 ]; then status=$code; break; fi
          done
          exit $status

      - name: Commit
        if: always()
        run: |
          git config user.name "property-lens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in data/processed public/data; do [ -d "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Update Property Lens data (steps ${{ inputs.steps || '1,3,2,5,6,4' }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
