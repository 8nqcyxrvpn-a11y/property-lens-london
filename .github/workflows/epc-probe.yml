# Manual: confirm the EPC token is saved and find which API address accepts it.
# Prints only HTTP status codes and the start of public responses, never the token.
name: EPC token check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check
        env:
          TOKEN: ${{ secrets.EPC_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::EPC_API_TOKEN is not set"; exit 1; fi
          echo "::notice title=Token::EPC_API_TOKEN is set (${#TOKEN} characters)"
          true || home=$(curl -s https://get-energy-performance-data.communities.gov.uk/ | grep -oE 'href="[^"]*(api|docs|developer)[^"]*"' | sort -u | head -n 12 | paste -sd ' ' -)
          true || echo "::notice title=Links on the service page::${home}"
          for url in \
            "https://api.get-energy-performance-data.communities.gov.uk/api/domestic/search?postcode=EC1V%202AR" \
            "https://api.get-energy-performance-data.communities.gov.uk/api/domestic/search?postcode=EC1V2AR" \
            "https://api.get-energy-performance-data.communities.gov.uk/api/domestic/search?council=Islington&page_size=2" \
            "https://api.get-energy-performance-data.communities.gov.uk/api/domestic/search?local_authority=E09000019&page_size=2" \
            "https://api.get-energy-performance-data.communities.gov.uk/api/domestic/search?local-authority=E09000019&size=2" \
            "https://api.get-energy-performance-data.communities.gov.uk/api" \
            "https://api.get-energy-performance-data.communities.gov.uk/api/" \
            "https://api.get-energy-performance-data.communities.gov.uk/api/docs" \
            "https://api.get-energy-performance-data.communities.gov.uk/api/openapi.json" \
            "https://api.get-energy-performance-data.communities.gov.uk/openapi.json" \
            "https://api.get-energy-performance-data.communities.gov.uk/docs" \
            "https://api.get-energy-performance-data.communities.gov.uk/api-docs" \
            "https://api.get-energy-performance-data.communities.gov.uk/swagger.json" \
            "https://api.get-energy-performance-data.communities.gov.uk/api/domestic" ; do
            code=$(curl -s -o body.txt -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" "$url")
            echo "::notice title=HTTP ${code}::${url} :: $(head -c 600 body.txt | tr '\n' ' ' | sed 's/%/%25/g')"
          done
